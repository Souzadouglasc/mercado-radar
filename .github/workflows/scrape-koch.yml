name: scrape-koch

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 BRT
  workflow_dispatch:
    inputs:
      limit:
        description: "Max de produtos"
        default: "200"
      dry_run:
        description: "Coleta sem enviar (true/false)"
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape Koch
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >
          npx tsx scrapers/runner/run.ts --market koch
          --limit "${{ inputs.limit || '200' }}"
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

