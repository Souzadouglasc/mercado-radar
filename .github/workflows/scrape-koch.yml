name: scrape-koch

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max de produtos"
        default: "200"
      dry_run:
        description: "Coleta sem enviar (true/false)"
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape Koch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          npx tsx scrapers/runner/run.ts --market koch
          --limit "${{ inputs.limit || '200' }}"
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

