name: scrape-all

on:
  schedule:
    # Diário 06:00 BRT (09:00 UTC): incremental
    - cron: "0 9 * * 1-6"
    # Domingo 05:00 BRT (08:00 UTC): full semanal
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max de produtos por mercado"
        default: "2000"
      dry_run:
        description: "Coleta sem enviar (true/false)"
        default: "false"
      mode:
        description: "incremental ou full"
        default: "incremental"
      markets:
        description: "Mercados separados por vírgula (ex: fort,koch,brasil,komprao,bistek,angeloni)"
        default: ""
      max_actions:
        description: "Máximo de ações para processar neste run"
        default: "20"

jobs:
  dispatch:
    name: Dispatch Dynamic Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.dispatch.outputs.matrix }}
      hasWork: ${{ steps.dispatch.outputs.hasWork }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dispatch scrape actions
        id: dispatch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_ACTIONS: ${{ inputs.max_actions || '20' }}
          MARKETS: ${{ inputs.markets }}
        run: |
          set -euo pipefail
          args=(--max-actions "$MAX_ACTIONS")
          if [[ -n "$MARKETS" ]]; then args+=(--markets "$MARKETS"); fi
          npx tsx scripts/dispatch-scrape-actions.ts "${args[@]}" | tee dispatch-output.json
          echo "matrix=$(cat dispatch-output.json | jq -c .matrix)" >> $GITHUB_OUTPUT
          echo "hasWork=$(cat dispatch-output.json | jq -r .hasWork)" >> $GITHUB_OUTPUT

  scrape:
    name: Scrape Market
    needs: dispatch
    if: needs.dispatch.outputs.hasWork == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: scrape-${{ matrix.market_slug }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dispatch.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape ${{ matrix.market_slug }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKET_SLUG: ${{ matrix.market_slug }}
          SCRAPE_LIMIT: ${{ matrix.limit }}
          SCRAPE_ACTION_IDS: ${{ matrix.action_ids }}
          SCRAPE_ACTION_URLS: ${{ matrix.action_urls }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--market "$MARKET_SLUG" --limit "$SCRAPE_LIMIT" \
            --action-ids "$SCRAPE_ACTION_IDS" --action-urls "$SCRAPE_ACTION_URLS" --concurrency 4)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npx tsx scrapers/runner/run.ts "${args[@]}"

  scrape-fallback:
    name: Scrape Fallback (Traditional)
    needs: dispatch
    if: needs.dispatch.outputs.hasWork == 'false' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: scrape-${{ matrix.market }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        market: [fort, koch, brasil, komprao, bistek, angeloni]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape ${{ matrix.market }} (incremental, diário)
        if: github.event.schedule != '0 8 * * 0' && (inputs.mode || 'incremental') == 'incremental'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          npx tsx scrapers/runner/run.ts --market ${{ matrix.market }}
          --limit "${{ inputs.limit || '2000' }}"
          --incremental
          --skip $(( ($(date -u +%s) / 86400) * 2000 ))
          --concurrency 4
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Scrape ${{ matrix.market }} (full, domingo)
        if: github.event.schedule == '0 8 * * 0' || (inputs.mode || '') == 'full'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          npx tsx scrapers/runner/run.ts --market ${{ matrix.market }}
          --limit "${{ inputs.limit || '2000' }}"
          --full
          --skip $(( ($(date -u +%s) / 86400) * 2000 ))
          --concurrency 4
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

  scheduled-sweep:
    name: Daily Catalog Sweep
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        market: [fort, koch, brasil, komprao, bistek, angeloni]
    concurrency:
      group: scrape-${{ matrix.market }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape ${{ matrix.market }} catalog segment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SWEEP_MODE: ${{ github.event.schedule == '0 8 * * 0' && 'full' || 'incremental' }}
        run: |
          args=(--market "${{ matrix.market }}" --limit 2000 --skip "$(( ($(date -u +%s) / 86400) * 2000 ))" --concurrency 6)
          if [[ "$SWEEP_MODE" == "full" ]]; then
            args+=(--full)
          else
            args+=(--incremental)
          fi
          npx tsx scrapers/runner/run.ts "${args[@]}"

