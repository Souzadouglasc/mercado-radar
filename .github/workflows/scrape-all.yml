name: scrape-all

on:
  schedule:
    # Diário 06:00 BRT (09:00 UTC): incremental — sem lastmod no sitemap,
    # fatia por skip rotacionado pelo dia da semana (dia * 500).
    - cron: "0 9 * * 1-6"
    # Domingo 05:00 BRT (08:00 UTC): full semanal.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max de produtos por mercado"
        default: "200"
      dry_run:
        description: "Coleta sem enviar (true/false)"
        default: "false"
      mode:
        description: "incremental ou full"
        default: "incremental"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        market: [fort, koch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape ${{ matrix.market }} (incremental, diário)
        if: github.event.schedule != '0 8 * * 0' && (inputs.mode || 'incremental') == 'incremental'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >
          npx tsx scrapers/runner/run.ts --market ${{ matrix.market }}
          --limit "${{ inputs.limit || '500' }}"
          --incremental
          --skip $(( $(date +%u) * 500 % 2000 ))
          --concurrency 4
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Scrape ${{ matrix.market }} (full, domingo)
        if: github.event.schedule == '0 8 * * 0' || (inputs.mode || '') == 'full'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >
          npx tsx scrapers/runner/run.ts --market ${{ matrix.market }}
          --limit "${{ inputs.limit || '500' }}"
          --full
          --concurrency 4
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
